# Render Blueprint — backend API (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: nextgenhrlab-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Set in Render dashboard: MONGODB_URI, JWT_SECRET, CLIENT_ORIGIN, PORT (optional)
