name: Keep Render awake

on:
  schedule:
    # Every 10 minutes. Render free web services sleep after about 15 minutes idle.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health endpoint
        run: |
          curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 120 \
            "https://nextgenhr-687u.onrender.com/api/health"
          echo
          echo "Ping succeeded"
